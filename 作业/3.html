<script>
        <!--个人明信片的案例:明信片包含属性和方法，贴近大学生生活-->
        var studentCard = {
            name: "张三",
            age: 20,
            sex: "男",
            hobby: ["篮球", "游戏", "攀岩"],
            grade: "大四",
            //方法
            introduce: function() {
                //使用this关键字访问对象的属性,`反引号可以嵌入表达式,dollar+大括号就是表达式
                return `大家好，我是${this.name}，今年${this.age}岁，性别${this.sex}，我的爱好是${this.hobby.join("、")}，我现在是${this.grade}年级的学生。`;
            },
            //方法
            upgrade:function() {
                const grades = ["大一", "大二", "大三", "大四"];
                console.log('index='+index)
                // 这里可以添加升级逻辑
                var index = grades.indexOf(this.grade);
                    if(index!==-1 && index < grades.length - 1) {
                        this.grade = grades[index + 1];
                    } 
                    else {
                       this.grade='毕业';}
                    return `升级后，我现在是${this.grade}年级的学生。`;
                },
        };
                document.write(studentCard.introduce());
                document.write(studentCard.upgrade());
    </script>
